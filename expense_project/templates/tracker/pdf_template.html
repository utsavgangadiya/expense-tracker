<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: DejaVu Sans, sans-serif; }
        table { width:100%; border-collapse: collapse; margin-top:20px; }
        th, td { border:1px solid #444; padding:8px; font-size:12px; }
        th { background:#eee; }
        h2 { text-align:center; }
    </style>
</head>
<body>

    <h2>Expense Report</h2>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            {% for e in expenses %}
            <tr>
                <td>{{ e.date }}</td>
                <td>{{ e.title }}</td>
                <td>{{ e.category }}</td>
                <td>${{ e.amount }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
